[project]
name = "ch5-fin"
version = "0.1.0"
description = "ch5完成形: PLaMo Embedding - 意味類似検索"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.66.0",
    "pandas>=3.0.0",
    "plotly>=7.0.0",
    "openpyxl>=3.1.0",
    "torch>=2.14.0",
    "transformers>=5.20.0",
    # PLaMo-Embedding のトークナイザーが 0.2.2 で削除された SentencePieceProcessor.Init を使うため
    "sentencepiece<0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
